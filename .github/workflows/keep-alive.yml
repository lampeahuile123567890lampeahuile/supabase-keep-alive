name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 */6 * * *" # toutes les 6h
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Wake up Supabase (retry)
        run: |
          URL="https://ftvnkjlrqkkypxdqcchv.supabase.co/rest/v1/"

          echo "Pinging Supabase..."

          for i in {1..5}; do
            echo "Attempt $i..."

            STATUS=$(curl -o /dev/null -s -w "%{http_code}" "$URL")

            echo "HTTP status: $STATUS"

            if [ "$STATUS" = "200" ] || [ "$STATUS" = "401" ]; then
              echo "Supabase is awake ✅"
              exit 0
            fi

            echo "Still sleeping... waiting 10s"
            sleep 10
          done

          echo "Supabase did not wake up, but continuing anyway."
          exit 0
